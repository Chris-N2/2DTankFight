schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Browser game inspired by Atari 2600 "Combat" (Tank variation). Full vision and design decisions: CLAUDE.md.
  Tech stack: TypeScript end-to-end; browser client (Canvas/PixiJS); Node server for multiplayer.
  The simulation is a pure, fixed-timestep, input-driven module shared by client (single-player) and
  server (authoritative multiplayer). No rendering or networking inside the simulation.
  Single-player first; multiplayer added later without reworking the simulation.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - Write tests for every spec scenario that can be tested automatically; QA fails untested scenarios.
      - When implementation is complete, suggest running /qa before /opsx:archive.
  archive:
    guidance:
      - 'QA must have passed first. Check that openspec/changes/<name>/qa-report.md exists and its verdict is PASS. If it is missing or FAIL, stop and suggest running /qa.'
